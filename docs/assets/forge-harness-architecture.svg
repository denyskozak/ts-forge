<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">TS Forge harness architecture</title>
  <desc id="desc">The Electron renderer communicates through typed IPC with an agent loop that uses project analysis, TypeScript tools, reviewed writes, local Ollama inference and SQLite persistence.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7ef"/>
      <stop offset="1" stop-color="#f4f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b6f59"/>
    </marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:42px;font-weight:700;fill:#17181b}.subtitle{font-size:20px;font-weight:400;fill:#68707d}.label{font-size:19px;font-weight:700;fill:#202228}.copy{font-size:15px;font-weight:400;fill:#69717e}.tiny{font-size:13px;font-weight:600;fill:#8a6a52;letter-spacing:1.4px}.box{fill:#fff;stroke:#dfe3e8;stroke-width:2}.warm{fill:#fff9f4;stroke:#e8c9ad}.blue{fill:#f6f9ff;stroke:#cbd8ef}.green{fill:#f5faf7;stroke:#c9dfd1}.line{fill:none;stroke:#8b6f59;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="980" rx="28" fill="#ffffff"/>
  <rect x="32" y="32" width="1536" height="126" rx="22" fill="url(#header)"/>
  <circle cx="86" cy="84" r="23" fill="#302b29"/><path d="M89 53 69 86h17l-7 30 31-42H92z" fill="#e3a574"/>
  <text x="130" y="91" class="title">TS Forge harness</text>
  <text x="130" y="126" class="subtitle">A local, reviewable agent loop for TypeScript projects</text>
  <text x="1435" y="88" text-anchor="end" class="tiny">LOCAL FIRST</text>
  <text x="1435" y="119" text-anchor="end" class="copy">Electron · React · TypeScript</text>

  <g filter="url(#shadow)">
    <rect class="box blue" x="70" y="215" width="310" height="230" rx="20"/>
    <text x="100" y="255" class="tiny">RENDERER</text>
    <text x="100" y="292" class="label">React workspace UI</text>
    <text x="100" y="326" class="copy">Chat and streaming output</text>
    <text x="100" y="354" class="copy">Diff review and checkpoints</text>
    <text x="100" y="382" class="copy">Critical questions with choices</text>
    <text x="100" y="410" class="copy">Voice drafts and project context</text>

    <rect class="box warm" x="495" y="195" width="610" height="270" rx="22"/>
    <text x="530" y="235" class="tiny">ELECTRON MAIN PROCESS</text>
    <text x="530" y="274" class="label">Persisted agent loop</text>
    <rect x="530" y="302" width="152" height="62" rx="12" fill="#fff" stroke="#e6d4c4"/>
    <text x="606" y="328" text-anchor="middle" class="copy">1 · Think</text><text x="606" y="350" text-anchor="middle" class="copy">and review</text>
    <rect x="724" y="302" width="152" height="62" rx="12" fill="#fff" stroke="#e6d4c4"/>
    <text x="800" y="328" text-anchor="middle" class="copy">2 · Inspect</text><text x="800" y="350" text-anchor="middle" class="copy">with tools</text>
    <rect x="918" y="302" width="152" height="62" rx="12" fill="#fff" stroke="#e6d4c4"/>
    <text x="994" y="328" text-anchor="middle" class="copy">3 · Ask or</text><text x="994" y="350" text-anchor="middle" class="copy">propose</text>
    <path d="M682 333h34" class="line"/><path d="M876 333h34" class="line"/>
    <text x="530" y="405" class="copy">Bounded context · tool validation · human gates · stop/recovery</text>

    <rect class="box green" x="1220" y="215" width="310" height="230" rx="20"/>
    <text x="1250" y="255" class="tiny">LOCAL INFERENCE</text>
    <text x="1250" y="292" class="label">Ollama</text>
    <text x="1250" y="326" class="copy">Tool-capable local model</text>
    <text x="1250" y="354" class="copy">Loopback endpoint only</text>
    <text x="1250" y="382" class="copy">No cloud model integration</text>
    <text x="1250" y="410" class="copy">Configurable context budget</text>
  </g>

  <path d="M380 330h105" class="line"/><path d="M1115 330h95" class="line"/>
  <text x="432" y="311" text-anchor="middle" class="tiny">TYPED IPC</text>
  <text x="1163" y="311" text-anchor="middle" class="tiny">HTTP LOOPBACK</text>

  <text x="70" y="535" class="tiny">CAPABILITIES</text>
  <g filter="url(#shadow)">
    <rect class="box" x="70" y="565" width="340" height="160" rx="18"/>
    <circle cx="108" cy="605" r="16" fill="#eef4ff"/><text x="108" y="611" text-anchor="middle" class="tiny">01</text>
    <text x="140" y="611" class="label">Project intelligence</text>
    <text x="100" y="650" class="copy">Architecture map · framework detection</text>
    <text x="100" y="679" class="copy">Feature tracing · bounded source reads</text>

    <rect class="box" x="450" y="565" width="340" height="160" rx="18"/>
    <circle cx="488" cy="605" r="16" fill="#eef4ff"/><text x="488" y="611" text-anchor="middle" class="tiny">02</text>
    <text x="520" y="611" class="label">TypeScript tools</text>
    <text x="480" y="650" class="copy">Diagnostics · definitions · references</text>
    <text x="480" y="679" class="copy">Quick info · isolated compiler check</text>

    <rect class="box" x="830" y="565" width="340" height="160" rx="18"/>
    <circle cx="868" cy="605" r="16" fill="#fff1e5"/><text x="868" y="611" text-anchor="middle" class="tiny">03</text>
    <text x="900" y="611" class="label">Controlled mutation</text>
    <text x="860" y="650" class="copy">Exact replacements · reviewed diffs</text>
    <text x="860" y="679" class="copy">Atomic writes · guarded undo</text>

    <rect class="box" x="1210" y="565" width="320" height="160" rx="18"/>
    <circle cx="1248" cy="605" r="16" fill="#eef8f1"/><text x="1248" y="611" text-anchor="middle" class="tiny">04</text>
    <text x="1280" y="611" class="label">Human decisions</text>
    <text x="1240" y="650" class="copy">Critical clarification options</text>
    <text x="1240" y="679" class="copy">Write and compiler approvals</text>
  </g>

  <path d="M800 466v70" class="line"/>
  <g filter="url(#shadow)">
    <rect class="box warm" x="180" y="800" width="360" height="110" rx="18"/>
    <text x="215" y="840" class="label">Workspace files</text>
    <text x="215" y="873" class="copy">Ignored paths · hashes · safe boundaries</text>
    <rect class="box blue" x="620" y="800" width="360" height="110" rx="18"/>
    <text x="655" y="840" class="label">SQLite state</text>
    <text x="655" y="873" class="copy">Sessions · journal · maps · checkpoints</text>
    <rect class="box green" x="1060" y="800" width="360" height="110" rx="18"/>
    <text x="1095" y="840" class="label">Restricted processes</text>
    <text x="1095" y="873" class="copy">Bundled tsc · MLX training workspace</text>
  </g>
  <path d="M660 725 440 790" class="line"/><path d="M800 725v65" class="line"/><path d="M940 725 1160 790" class="line"/>
  <text x="800" y="950" text-anchor="middle" class="copy">Code and model traffic stay on the machine by design.</text>
</svg>
